@if (modalService.isOpen()) {
  <div class="modal-backdrop" (click)="modalService.close()">
    <div class="white-modal-box" (click)="$event.stopPropagation()">
      <!-- Header -->
      <div class="modal-header">
        <div class="header-left">
          <div class="action-icon-badge">
            <svg class="badge-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </div>
          <h2 class="modal-title">Confirm Your Action</h2>
        </div>
        <button class="close-icon-btn" (click)="modalService.close()" title="Close">
          <svg class="close-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
        </button>
      </div>

      <!-- Divider line -->
      <div class="modal-divider"></div>

      <!-- Modal Body -->
      <div class="modal-body">
        <div class="body-center-space"></div>
        <p class="confirmation-text">
          Are you sure you want to delete this file? This action cannot be undone.
        </p>
      </div>

      <!-- Action Footer -->
      <div class="modal-footer">
        <button class="btn-cancel" (click)="modalService.close()">Cancel</button>
        <button class="btn-confirm" (click)="onConfirm()">Confirm</button>
      </div>
    </div>
  </div>
}
