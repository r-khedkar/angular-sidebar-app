@if (svc.isOpen()) {
  <div class="drawer-overlay" (click)="svc.close()">
    <div class="drawer-panel" (click)="$event.stopPropagation()">
      <div class="drawer-header">
        <div class="header-title-group">
          <div class="icon-badge">
            <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </div>
          <h2 class="drawer-title">Confirm Your Action</h2>
        </div>
        <button class="drawer-close-btn" (click)="svc.close()" title="Close">
          <svg class="close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
        </button>
      </div>

      <div class="drawer-body">
        <p class="drawer-message">
          Are you sure you want to delete this file? This action cannot be undone.
        </p>
      </div>

      <div class="drawer-footer">
        <button class="btn-cancel" (click)="svc.close()">Cancel</button>
        <button class="btn-confirm" (click)="onConfirm()">Confirm</button>
      </div>
    </div>
  </div>
}
